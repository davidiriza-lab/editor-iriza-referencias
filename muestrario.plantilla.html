<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estilos del editor</title>
<style>
:root {
  --fondo: #141416; --panel: #1e1e21; --panel2: #26262a; --linea: #2c2c30;
  --texto: #ecebe8; --tenue: #9a9893; --negro: #0b0b0c;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --lado: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
.caja { max-width: 1040px; margin: 0 auto; padding: 0 var(--lado); }

header.top { padding-top: 34px; padding-bottom: 18px; }
h1 { font-size: 32px; line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.02em; font-weight: 700; }
.sub { color: var(--tenue); margin: 0; max-width: 60ch; }
.sub b { color: var(--texto); font-weight: 600; font-family: var(--mono); font-size: 15px; }

.barra { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fondo) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
.barra .caja { display: flex; gap: 10px; padding-top: 10px; padding-bottom: 10px; align-items: center; }
@media (min-width: 900px) { select.campo { flex-basis: 300px; } }
.campo { flex: 1 1 0; min-width: 0; height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--linea);
  background: var(--panel); font-size: 16px; }
select.campo { flex: 0 1 42%; appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--tenue) 50%), linear-gradient(135deg, var(--tenue) 50%, transparent 50%);
  background-position: calc(100% - 20px) 20px, calc(100% - 15px) 20px; background-size: 5px 5px; background-repeat: no-repeat; }
.cuenta { font: 13px var(--mono); color: var(--tenue); margin: 18px 0 0; }

.rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; padding: 14px 0 60px; align-items: start; }
@media (min-width: 640px) { .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { :root { --lado: 48px; } .rejilla { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 30px 18px; } h1 { font-size: 44px; } header.top { padding-top: 56px; } }

.tarjeta { all: unset; display: block; cursor: pointer; min-width: 0; }
.tarjeta:focus-visible { outline: 2px solid var(--texto); outline-offset: 4px; border-radius: 12px; }
.pantalla { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--negro);
  border: 1px solid var(--linea); }
.pantalla canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.num { position: absolute; top: 8px; left: 8px; font: 600 13px var(--mono); padding: 3px 7px; border-radius: 6px;
  background: rgba(11,11,12,.72); color: #fff; }
.dur { position: absolute; top: 8px; right: 8px; font: 12px var(--mono); padding: 3px 7px; border-radius: 6px; background: rgba(11,11,12,.72); color: #fff; font-variant-numeric: tabular-nums; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.12); }
.prog i { display: block; height: 100%; width: 0; background: var(--acento, var(--texto)); }
.pie { padding: 10px 2px 0; }
.apodo { font-weight: 600; font-size: 15px; line-height: 1.3; margin: 0; }
.meta { color: var(--tenue); font-size: 13px; margin: 3px 0 0; line-height: 1.35; }
.vacio { grid-column: 1 / -1; color: var(--tenue); text-align: center; padding: 60px 0; }

dialog { padding: 0; border: 0; background: var(--fondo); color: var(--texto); width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; }
dialog::backdrop { background: rgba(0,0,0,.7); }
@media (min-width: 900px) { dialog { width: min(1040px, calc(100% - 64px)); height: auto; max-height: calc(100% - 64px); margin: auto; border-radius: 16px; border: 1px solid var(--linea); } }
.ficha-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px var(--lado);
  background: var(--fondo); border-bottom: 1px solid var(--linea); }
.ficha-top h2 { font-size: 18px; line-height: 1.25; margin: 0; flex: 1; min-width: 0; outline: none; }
.ficha-top h2 small { display: block; color: var(--tenue); font: 500 13px var(--mono); }
.cerrar { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--linea); background: var(--panel); cursor: pointer; font-size: 22px; line-height: 1; }
.ficha { display: grid; gap: 28px; padding: 20px var(--lado) 40px; }
@media (min-width: 900px) { .ficha { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .ficha .col-izq { position: sticky; top: 84px; } }
.grande { max-width: min(340px, 25vh); margin: 0 auto; }
@media (min-width: 900px) { .grande { max-width: 340px; } }
.controles { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.play { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--texto); color: var(--negro); cursor: pointer; font-size: 16px; }
.controles input[type=range] { flex: 1; accent-color: var(--acento, var(--texto)); height: 30px; }
.controles .t { font: 13px var(--mono); color: var(--tenue); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 899px) { .controles { margin-left: -60px; margin-right: -60px; } }
.datos { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 18px; padding: 0; list-style: none; font: 14px var(--mono); color: var(--tenue); }
.datos b { color: var(--texto); font-weight: 600; }
.ficha h3 { font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--tenue); font-weight: 600; margin: 26px 0 8px; }
.ficha h3:first-child { margin-top: 0; }
.ficha p { margin: 0 0 10px; max-width: 66ch; }
.paleta { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.paleta div { border-radius: 8px; overflow: hidden; border: 1px solid var(--linea); background: var(--panel); }
.paleta i { display: block; height: 44px; }
.paleta span { display: block; padding: 5px 8px 0; font: 12px var(--mono); color: var(--texto); }
.paleta em { display: block; padding: 0 8px 6px; font: 12px var(--mono); font-style: normal; color: var(--tenue); }
.encargo { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 14px; }
.encargo p { font-family: var(--mono); font-size: 14px; margin: 0 0 12px; word-break: break-word; }
.encargo .fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.encargo small { color: var(--tenue); font-size: 13px; }
.copiar { height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--texto); color: var(--negro); font-weight: 600; cursor: pointer; white-space: nowrap; }
.hoja { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--linea); background: var(--negro); }
.hermanos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.hermanos button { min-height: 52px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--linea); background: var(--panel); cursor: pointer; text-align: left; }
.hermanos small { display: block; font: 12px var(--mono); color: var(--tenue); }
footer { color: var(--tenue); font-size: 13px; padding: 0 0 40px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top caja">
  <h1>Estilos del editor</h1>
  <p class="sub"><b>__TOTAL__</b> formatos en <b>__FAMILIAS__</b> familias, con los cuadros del video de referencia corriendo a su tiempo real. Elige uno para ver su ficha y copiar el encargo para Claude.</p>
</header>

<div class="barra" role="search" aria-label="Filtrar formatos">
  <div class="caja">
    <input id="buscar" class="campo" type="search" placeholder="Buscar: 3D, pizarra…" aria-label="Buscar formato" autocomplete="off">
    <select id="familia" class="campo" aria-label="Familia"><option value="">Todas</option></select>
  </div>
</div>

<main class="caja">
  <p id="cuenta" class="cuenta" aria-live="polite"></p>
  <div id="rejilla" class="rejilla"></div>
</main>
<footer class="caja">__PIE__</footer>

<dialog id="ficha" aria-labelledby="ficha-titulo"></dialog>

<script>
const D = /*__DATOS__*/null;
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ruta = (f, c) => `formatos/${encodeURIComponent(f.dir)}/cuadros/${encodeURIComponent(c)}`;
const tc = s => { const m = Math.floor(s / 60), r = s - m * 60; return `${String(m).padStart(2, '0')}:${r.toFixed(1).padStart(4, '0')}`; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// color de acento de cada formato: el más presente de su paleta que no sea casi negro ni casi blanco
function acento(f) {
  const lum = h => { const n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return { l: (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255, s: (Math.max(r, g, b) - Math.min(r, g, b)) / 255 }; };
  const c = f.paleta.map((h, i) => ({ h, p: f.pct[i] || 0, ...lum(h) })).filter(x => x.l > 0.18 && x.l < 0.9);
  c.sort((a, b) => (b.s * 2 + b.p / 100) - (a.s * 2 + a.p / 100));
  return c[0]?.h || '#ecebe8';
}

// reproductor en canvas: cambia de cuadro solo cuando el siguiente ya cargó (nunca queda en blanco),
// se salta los cuadros que durarían < 0.2 s (capturados justo antes de un corte: se ven como destello)
// y cruza cuadros en 120 ms (sin cruce si el sistema pide reducir movimiento)
const CRUCE = QUIETO ? 0 : 120;
class Reproductor {
  constructor(f, canvas, prog, tcEl) {
    this.f = f; this.cv = canvas; this.cx = canvas.getContext('2d'); this.prog = prog; this.tcEl = tcEl;
    const q = f.cuadros.filter((c, i, a) => i === a.length - 1 || a[i + 1][0] - c[0] >= 0.2);
    if (q.length) q[0] = [0, q[0][1]];
    this.q = q;
    const ult = f.cuadros.length ? f.cuadros[f.cuadros.length - 1][0] : 0;
    this.fin = Math.max(f.dur || 0, ult + 0.5, 0.5);
    this.t = 0; this.andando = false; this.ultimo = 0; this.imgs = null;
    this.cur = -1; this.prev = -1; this.desde = 0; this.sucio = true;
    new ResizeObserver(() => this.medir()).observe(canvas);
  }
  medir() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (w && h && (w !== this.cv.width || h !== this.cv.height)) { this.cv.width = w; this.cv.height = h; this.sucio = true; this.pintar(performance.now()); }
  }
  listo(i) { const im = this.imgs?.[i]; return im && im.complete && im.naturalWidth > 0; }
  cargar() {
    if (this.imgs) return;
    this.imgs = this.q.map(([, c]) => { const im = new Image(); im.decoding = 'async'; im.onload = () => { this.sucio = true; this.pintar(performance.now()); }; im.src = ruta(this.f, c); return im; });
  }
  soltar() { this.imgs = null; }   // la imagen pintada se queda en el canvas; el navegador libera la memoria
  indice() { const q = this.q; let i = 0; while (i + 1 < q.length && q[i + 1][0] <= this.t) i++; return i; }
  dibujar(im, alfa) {
    const W = this.cv.width, H = this.cv.height, iw = im.naturalWidth, ih = im.naturalHeight;
    const k = this.f.horizontal ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
    const w = iw * k, h = ih * k;
    this.cx.globalAlpha = alfa; this.cx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); this.cx.globalAlpha = 1;
  }
  pintar(ahora) {
    if (!this.cv.width) return;
    const i = this.indice();
    if (i !== this.cur && this.listo(i)) { this.prev = this.cur; this.cur = i; this.desde = ahora; this.sucio = true; }
    const a = CRUCE ? Math.min(1, (ahora - this.desde) / CRUCE) : 1;
    if (this.sucio || a < 1) {
      if (this.cur >= 0 && this.listo(this.cur)) {
        this.cx.fillStyle = '#0b0b0c'; this.cx.fillRect(0, 0, this.cv.width, this.cv.height);
        if (a < 1 && this.listo(this.prev)) this.dibujar(this.imgs[this.prev], 1);
        this.dibujar(this.imgs[this.cur], a);
      }
      this.sucio = a < 1;
    }
    if (this.prog) this.prog.style.width = (this.t / this.fin * 100).toFixed(2) + '%';
    if (this.tcEl) this.tcEl.textContent = tc(this.t);
  }
  mostrar() { this.pintar(performance.now()); }
  ir(t) { this.t = Math.max(0, Math.min(this.fin - 0.001, t)); this.mostrar(); }
  paso(ahora) {
    if (!this.andando) { this.ultimo = ahora; return; }
    this.t = (this.t + (ahora - this.ultimo) / 1000) % this.fin; this.ultimo = ahora; this.pintar(ahora);
  }
}

const activos = new Set();
function bucle(ahora) { for (const r of activos) r.paso(ahora); requestAnimationFrame(bucle); }
requestAnimationFrame(bucle);

const visor = new IntersectionObserver(es => {
  for (const e of es) {
    const r = e.target._rep;
    if (e.isIntersecting) { r.cargar(); if (!QUIETO) { r.andando = true; activos.add(r); } }
    else { r.andando = false; activos.delete(r); r.soltar(); }
  }
}, { rootMargin: '200px 0px' });

const fam = k => D.familias[k]?.nombre || k;
const rejilla = $('#rejilla');
const tarjetas = D.formatos.map(f => {
  f.acento = acento(f);
  const b = document.createElement('button');
  b.className = 'tarjeta'; b.type = 'button'; b.style.setProperty('--acento', f.acento);
  b.setAttribute('aria-label', `${f.nombre}: ${f.apodo}. Abrir ficha`);
  const famN = fam(f.familia), pant = /p$/.test(String(f.n));
  const meta = [norm(famN).slice(0, 8) !== norm(f.apodo).slice(0, 8) ? famN : '', pant ? 'en pantalla' : ''].filter(Boolean).join(' · ');
  b.innerHTML = `<div class="pantalla"><canvas aria-hidden="true"></canvas>
      <span class="num">${esc(String(f.n).replace(/^(\d+)/, m => m.padStart(2, '0')))}</span><span class="dur">${tc(f.dur || 0).replace(/\.\d$/, '')}</span><div class="prog"><i></i></div></div>
    <div class="pie"><p class="apodo">${esc(f.apodo || f.nombre)}</p>${meta ? `<p class="meta">${esc(meta)}</p>` : ''}</div>`;
  const r = new Reproductor(f, $('canvas', b), $('.prog i', b), null);
  r.ir(QUIETO ? r.fin * 0.4 : Math.random() * r.fin);   // arrancan desfasados para que la pared no parpadee al unísono
  b._rep = r; b._f = f;
  b.addEventListener('click', () => abrir(f));
  visor.observe(b);
  f._buscar = norm([f.n, f.nombre, f.apodo, f.detalle, fam(f.familia)].join(' '));
  return b;
});
tarjetas.forEach(t => rejilla.appendChild(t));

// filtros
const sel = $('#familia');
Object.entries(D.familias).map(([k, v]) => [k, v.nombre, D.formatos.filter(f => f.familia === k).length])
  .filter(x => x[2]).sort((a, b) => a[1].localeCompare(b[1], 'es'))
  .forEach(([k, n, c]) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(k)}">${esc(n)} (${c})</option>`));
const vacio = Object.assign(document.createElement('p'), { className: 'vacio', textContent: 'Ningún formato coincide. Prueba con otra palabra o con todas las familias.' });
function filtrar() {
  const q = norm($('#buscar').value.trim()), fa = sel.value; let n = 0;
  for (const t of tarjetas) {
    const f = t._f, ok = (!fa || f.familia === fa) && (!q || q.split(/\s+/).every(p => f._buscar.includes(p)));
    t.hidden = !ok; if (ok) n++;
  }
  $('#cuenta').textContent = n === tarjetas.length ? `${n} formatos` : `${n} de ${tarjetas.length} formatos`;
  if (!n) rejilla.appendChild(vacio); else vacio.remove();
}
$('#buscar').addEventListener('input', filtrar); sel.addEventListener('change', filtrar); filtrar();

// ficha
const dlg = $('#ficha');
let repFicha = null;
function abrir(f, sinHash) {
  const fa = D.familias[f.familia] || {};
  const hermanos = D.formatos.filter(x => x.familia === f.familia && x !== f);
  const corte = f.cortes ? `1 cada ${(f.dur / f.cortes).toFixed(1)} s` : 'un solo plano';
  const encargo = `Edita este video con el formato ${f.nombre} (${f.apodo}): /ruta/a/tu/video.mp4`;
  dlg.style.setProperty('--acento', f.acento);
  dlg.innerHTML = `
    <div class="ficha-top"><h2 id="ficha-titulo" tabindex="-1"><small>${esc(f.nombre)}</small>${esc(f.apodo)}</h2><button class="cerrar" type="button" aria-label="Cerrar">×</button></div>
    <div class="ficha">
      <div class="col-izq"><div class="grande">
        <div class="pantalla"><canvas role="img" aria-label="Cuadros del video de referencia de ${esc(f.nombre)}"></canvas><div class="prog"><i></i></div></div>
        <div class="controles"><button class="play" type="button" aria-label="Reproducir">▶</button>
          <input type="range" min="0" max="1000" value="0" aria-label="Posición en el video"><span class="t"></span></div>
      </div></div>
      <div>
        <ul class="datos"><li>Duración <b>${tc(f.dur || 0)}</b></li><li>Cortes <b>${f.cortes}</b> (${corte})</li></ul>
        <h3>Para pedírselo a Claude</h3>
        <div class="encargo"><p>${esc(encargo)}</p><div class="fila"><button class="copiar" type="button">Copiar encargo</button><small>Al pegarlo, cambia la ruta por la de tu video.</small></div></div>
        <h3>Qué es</h3><p>${esc(f.detalle)}</p>
        <h3>Familia: ${esc(fa.nombre || f.familia)}</h3>
        ${fa.idea ? `<p>${esc(fa.idea)}</p>` : ''}
        ${fa.texto ? `<h3>Texto en pantalla</h3><p>${esc(fa.texto)}</p>` : ''}
        ${fa.mov ? `<h3>Movimiento</h3><p>${esc(fa.mov)}</p>` : ''}
        ${fa.audio ? `<h3>Audio</h3><p>${esc(fa.audio)}</p>` : ''}
        ${hermanos.length ? `<h3>Otros de la familia</h3><div class="hermanos">${hermanos.map(h => `<button type="button" data-n="${esc(h.n)}"><small>${esc(h.nombre)}</small>${esc(h.apodo)}</button>`).join('')}</div>` : ''}
        <h3>Paleta medida</h3>
        <div class="paleta">${f.paleta.map((h, i) => `<div><i style="background:${h}"></i><span>${h}</span><em>${f.pct[i] ?? ''} %</em></div>`).join('')}</div>
        ${f.hoja ? `<h3>Hoja de contacto</h3><img class="hoja" loading="lazy" alt="Hoja de contacto de ${esc(f.nombre)}" src="formatos/${encodeURIComponent(f.dir)}/hoja.jpg">` : ''}
      </div>
    </div>`;
  const r = repFicha = new Reproductor(f, $('.pantalla canvas', dlg), $('.prog i', dlg), $('.t', dlg));
  const rango = $('input[type=range]', dlg), play = $('.play', dlg);
  const orig = r.pintar.bind(r);
  r.pintar = ahora => { orig(ahora); rango.value = Math.round(r.t / r.fin * 1000); };
  const ponerPlay = on => { r.andando = on; play.textContent = on ? '❚❚' : '▶'; play.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir'); on ? activos.add(r) : activos.delete(r); };
  r.cargar(); r.ir(0); ponerPlay(!QUIETO);
  play.addEventListener('click', () => ponerPlay(!r.andando));
  rango.addEventListener('input', () => { ponerPlay(false); r.ir(rango.value / 1000 * r.fin); });
  $('.cerrar', dlg).addEventListener('click', () => dlg.close());
  $('.copiar', dlg).addEventListener('click', e => copiar(encargo, e.currentTarget));
  dlg.querySelectorAll('.hermanos button').forEach(b => b.addEventListener('click', () => abrir(D.formatos.find(x => String(x.n) === b.dataset.n))));
  if (!dlg.open) dlg.showModal();
  $('#ficha-titulo', dlg).focus({ preventScroll: true });
  dlg.scrollTop = 0; $('.ficha', dlg).scrollTop = 0;
  if (!sinHash) history.replaceState(null, '', '#' + f.dir);
}
dlg.addEventListener('close', () => { if (repFicha) { activos.delete(repFicha); repFicha = null; } history.replaceState(null, '', location.pathname + location.search); });

async function copiar(texto, boton) {
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: texto }); ta.style.position = 'fixed'; ta.style.opacity = '0';
    dlg.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove();
  }
  boton.textContent = ok ? 'Copiado' : 'Selecciónalo y cópialo';
  setTimeout(() => { boton.textContent = 'Copiar encargo'; }, 1800);
}

// abrir directo con #editor-12
const inicial = D.formatos.find(f => '#' + f.dir === location.hash);
if (inicial) abrir(inicial, true);
</script>
